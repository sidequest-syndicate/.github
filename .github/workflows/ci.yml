---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install linters
        run: |
          pip install yamllint
          npm install -g markdownlint-cli2

      - name: Lint YAML
        run: yamllint .

      - name: Lint Markdown
        run: markdownlint-cli2 '**/*.md'

      - name: Validate JSON
        run: |
          shopt -s globstar nullglob
          files=(**/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No JSON files to validate."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "Validating $f"
            python -m json.tool "$f" > /dev/null
          done
        shell: bash
